<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Quest v3</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal:#4ec9b0; --dark:#08080f; --panel:#0d0d18; --border:#1a1a30;
  --bright:#252545; --red:#e07070; --gold:#e0c070; --blue:#70a0e0;
  --purple:#b080f0; --green:#70e0a0; --text:#c0c0d0; --dim:#44445a;
}
body {
  background:var(--dark); min-height:100vh; display:flex;
  justify-content:center; padding:0.75rem; font-family:'VT323',monospace; color:var(--text);
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(78,201,176,.025) 31px,rgba(78,201,176,.025) 32px),
    repeating-linear-gradient(90deg,transparent,transparent 31px,rgba(78,201,176,.025) 31px,rgba(78,201,176,.025) 32px);
}
#root { max-width:980px; width:100%; display:flex; flex-direction:column; gap:0.5rem; }

/* ── HEADER ── */
#hdr { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--bright); padding-bottom:0.4rem; }
#logo { font-family:'Press Start 2P',monospace; font-size:11px; color:var(--teal); text-shadow:0 0 18px rgba(78,201,176,.5),2px 2px 0 #083028; letter-spacing:2px; }
#zone-badge { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--gold); background:#1a1400; border:1px solid #443300; padding:4px 8px; }
#achs-badge { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--dim); }

/* ── LAYOUT ── */
#layout { display:grid; grid-template-columns:320px 1fr; gap:0.5rem; align-items:start; }

/* ── MAP ── */
#map-wrap { position:relative; border:1px solid var(--bright); box-shadow:0 0 24px rgba(78,201,176,.08); }
#map-wrap::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px); pointer-events:none; }
canvas { display:block; image-rendering:pixelated; }
#combat-badge {
  display:none; position:absolute; top:4px; left:4px; z-index:10;
  font-family:'Press Start 2P',monospace; font-size:6px; color:var(--red);
  background:rgba(0,0,0,.85); border:1px solid var(--red); padding:3px 6px;
  animation:blink 0.7s infinite;
}
#seed-lbl { position:absolute; bottom:3px; right:5px; font-family:'Press Start 2P',monospace; font-size:5px; color:rgba(78,201,176,.3); z-index:10; }

/* ── RIGHT PANEL ── */
#rpanel { display:flex; flex-direction:column; gap:0.4rem; }

/* ── MISSION BOX (curriculum) ── */
#mission-box {
  background:linear-gradient(135deg,#0a1020,#0d1428);
  border:1px solid #2a3060; border-left:3px solid var(--gold);
  padding:0.5rem 0.7rem; position:relative; overflow:hidden;
}
#mission-box::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at top left,rgba(224,192,112,.06),transparent 60%); pointer-events:none; }
#mission-label { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--gold); letter-spacing:1px; margin-bottom:4px; }
#mission-text { font-size:16px; color:#d0c880; line-height:1.4; }
#mission-sql  { font-size:13px; color:var(--dim); margin-top:3px; font-style:italic; }
#xp-bar-wrap { margin-top:5px; }
#xp-label { font-family:'Press Start 2P',monospace; font-size:5px; color:var(--dim); margin-bottom:2px; display:flex; justify-content:space-between; }
#xp-bg { height:5px; background:#111; border:1px solid var(--border); }
#xp-fill { height:100%; background:linear-gradient(90deg,var(--gold),#ffd700); transition:width .4s; }

/* ── STATS ── */
.box { background:var(--panel); border:1px solid var(--border); border-top:1px solid var(--bright); padding:0.5rem 0.65rem; }
.btitle { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--teal); letter-spacing:1px; margin-bottom:0.4rem; opacity:.8; }
#stats { display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; }
.stat { font-size:15px; color:var(--dim); }
.stat span { color:var(--teal); }
.hp-bg { height:5px; background:#111; border:1px solid var(--border); grid-column:1/-1; margin-top:1px; }
.hp-bar { height:100%; background:var(--green); transition:width .3s; }
.hp-bar.mid { background:var(--gold); }
.hp-bar.low { background:var(--red); animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.35} }

/* ── INVENTORY ── */
#inv-wrap { display:flex; flex-wrap:wrap; gap:3px; min-height:22px; }
.badge { font-size:12px; background:#09091a; border:1px solid #333; padding:2px 7px; }
.badge.weapon { border-color:#663333; color:var(--red); }
.badge.armor  { border-color:#334466; color:var(--blue); }
.badge.potion { border-color:#336644; color:var(--green); }
.badge.gold   { border-color:#665533; color:var(--gold); }
.badge.key    { border-color:#663366; color:var(--purple); }

/* ── LOG ── */
#log { font-size:15px; line-height:1.5; max-height:100px; overflow-y:auto; color:var(--dim); scrollbar-width:thin; scrollbar-color:var(--bright) transparent; }
.lok { color:var(--teal); } .lerr { color:var(--red); }
.linfo { color:var(--gold); } .lrew { color:#ffd700; }
.lcmd { color:#666; font-style:italic; }

/* ── TERMINAL ── */
#term { display:flex; flex-direction:column; gap:0.35rem; }
#ctx-hint {
  font-size:14px; color:var(--dim); border-left:2px solid var(--bright);
  padding:2px 7px; min-height:1.4em; transition:color .3s;
}
#ctx-hint.active { color:var(--gold); border-left-color:var(--gold); }

/* autocomplete */
#ac-wrap { position:relative; }
#cmd {
  width:100%; background:#050510; border:1px solid var(--bright);
  color:var(--teal); font-family:'VT323',monospace; font-size:18px;
  padding:0.3rem 0.5rem; outline:none; caret-color:var(--teal);
}
#cmd:focus { border-color:var(--teal); box-shadow:0 0 8px rgba(78,201,176,.15); }
#ac-list {
  display:none; position:absolute; top:100%; left:0; right:0; z-index:50;
  background:#080818; border:1px solid var(--bright); border-top:none;
  max-height:160px; overflow-y:auto;
}
#ac-list.open { display:block; }
.ac-item {
  padding:4px 8px; font-family:'VT323',monospace; font-size:16px; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid #0d0d20;
}
.ac-item:hover, .ac-item.sel { background:#0e0e28; color:var(--teal); }
.ac-item .ac-sql { color:var(--gold); }
.ac-item .ac-desc { font-size:13px; color:var(--dim); text-align:right; }
.ac-item.locked { opacity:.35; cursor:default; }
.ac-item.locked .ac-sql { color:#444; }
#cmd-row { display:flex; gap:0.35rem; align-items:center; }
.prompt { color:var(--teal); font-size:20px; flex-shrink:0; margin-top:2px; }
#run-btn { background:var(--teal); color:#000; border:none; font-family:'Press Start 2P',monospace; font-size:7px; padding:0.4rem 0.7rem; cursor:pointer; flex-shrink:0; }
#run-btn:hover { background:#3ab89f; }
#run-btn:active { transform:scale(.95); }

/* ── CURRICULUM PROGRESS ── */
#curriculum { padding:0.45rem 0.65rem; }
#curr-title { font-family:'Press Start 2P',monospace; font-size:5px; color:var(--dim); letter-spacing:1px; margin-bottom:5px; }
#curr-steps { display:flex; gap:3px; flex-wrap:wrap; }
.cs {
  font-family:'Press Start 2P',monospace; font-size:5px; padding:3px 5px;
  border:1px solid var(--border); color:var(--dim); background:#09090f;
  transition:all .3s;
}
.cs.done  { border-color:#2a6a50; color:var(--teal); background:#061510; }
.cs.active{ border-color:var(--gold); color:var(--gold); background:#120e00; animation:pulse .8s infinite; }
.cs.locked{ opacity:.3; }
@keyframes pulse { 0%,100%{box-shadow:none}50%{box-shadow:0 0 6px rgba(224,192,112,.4)} }

/* ── LEGEND ── */
#legend { display:flex; flex-wrap:wrap; gap:4px 10px; }
.leg { font-size:13px; display:flex; align-items:center; gap:4px; color:var(--dim); }
.ldot { width:9px; height:9px; display:inline-block; flex-shrink:0; image-rendering:pixelated; }

/* ── MENU ── */
#mbtns { display:flex; gap:0.35rem; margin-top:0.4rem; }
.mbtn { background:#09091a; border:1px solid var(--border); color:var(--dim); font-family:'Press Start 2P',monospace; font-size:5.5px; padding:4px 7px; cursor:pointer; }
.mbtn:hover { border-color:var(--teal); color:var(--teal); }

@media(max-width:700px){
  #layout { grid-template-columns:1fr; }
  #map-wrap { display:flex; justify-content:center; }
}
</style>
</head>
<body>
<div id="root">

  <!-- HEADER -->
  <div id="hdr">
    <div id="logo">⚔ SQL QUEST</div>
    <div id="zone-badge">ZONA: <span id="zone-name">—</span></div>
    <div id="achs-badge">🏆 <span id="achs">0</span>/12</div>
  </div>

  <!-- LAYOUT -->
  <div id="layout">

    <!-- MAP -->
    <div id="map-wrap">
      <div id="combat-badge">⚠ COMBATE</div>
      <canvas id="mapCanvas" width="320" height="320"></canvas>
      <div id="seed-lbl">SEED:<span id="seed-disp">—</span></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rpanel">

      <!-- MISSION -->
      <div id="mission-box">
        <div id="mission-label">▶ MISIÓN ACTIVA</div>
        <div id="mission-text">Cargando misión...</div>
        <div id="mission-sql"></div>
        <div id="xp-bar-wrap">
          <div id="xp-label"><span>XP</span><span id="xp-nums">0/50</span></div>
          <div id="xp-bg"><div id="xp-fill" style="width:0%"></div></div>
        </div>
      </div>

      <!-- STATS -->
      <div class="box">
        <div class="btitle">▶ HÉROE</div>
        <div id="stats">
          <div class="stat">HP: <span id="s-hp">100</span></div>
          <div class="stat">ATK: <span id="s-atk">10</span></div>
          <div class="stat">DEF: <span id="s-def">0</span></div>
          <div class="stat">Lvl: <span id="s-lvl">1</span></div>
          <div class="stat">Oro: <span id="s-gold">0</span></div>
          <div class="stat">Pos: <span id="s-pos">(0,0)</span></div>
          <div class="hp-bg"><div class="hp-bar" id="hp-bar" style="width:100%"></div></div>
        </div>
      </div>

      <!-- INVENTORY -->
      <div class="box">
        <div class="btitle">▶ INVENTARIO</div>
        <div id="inv-wrap"><span style="font-size:13px;color:var(--dim)">Vacío</span></div>
      </div>

      <!-- LOG -->
      <div class="box">
        <div class="btitle">▶ LOG</div>
        <div id="log"></div>
      </div>

      <!-- TERMINAL -->
      <div class="box" id="term">
        <div class="btitle">▶ TERMINAL SQL</div>
        <div id="ctx-hint">—</div>
        <div id="ac-wrap">
          <div id="cmd-row">
            <span class="prompt">›</span>
            <input id="cmd" type="text" placeholder="Escribe SQL... (Tab = autocompletar)" autocomplete="off" spellcheck="false"/>
            <button id="run-btn" onclick="ejecutar()">RUN</button>
          </div>
          <div id="ac-list"></div>
        </div>
      </div>

      <!-- CURRICULUM PROGRESS -->
      <div class="box" id="curriculum">
        <div id="curr-title">▶ PLAN DE ESTUDIOS</div>
        <div id="curr-steps"></div>
      </div>

      <!-- LEGEND + MENU -->
      <div class="box">
        <div class="btitle">▶ LEYENDA</div>
        <div id="legend">
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-hero"></canvas>Héroe</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-enemy"></canvas>Enemigo</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-treasure"></canvas>Cofre</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-weapon"></canvas>Arma</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-armor"></canvas>Armadura</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-potion"></canvas>Poción</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-wall"></canvas>Muro</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-exit"></canvas>Salida</div>
          <div class="leg"><canvas class="ldot" width="9" height="9" id="l-key"></canvas>Llave</div>
        </div>
        <div id="mbtns">
          <button class="mbtn" onclick="saveGame()">💾 Guardar</button>
          <button class="mbtn" onclick="loadGame()">📂 Cargar</button>
          <button class="mbtn" onclick="resetGame()">🔄 Nuevo mapa</button>
        </div>
      </div>

    </div><!-- /rpanel -->
  </div><!-- /layout -->
</div><!-- /root -->

<script>
// ════════════════════════════════════════════════════
// CURRICULUM — Plan de estudios estructurado
// ════════════════════════════════════════════════════
const CURRICULUM = [
  {
    id:'sel_star', zone:'Caverna Inicial', zoneColor:'#4ec9b0',
    title:'SELECT básico', short:'SELECT *',
    mission:'Explora tu entorno con SELECT * FROM mapa;',
    hint:'Para ver tu posición y caminos disponibles escribe: SELECT * FROM mapa;',
    template:'SELECT * FROM mapa;',
    teaches:'SELECT * FROM tabla — devuelve todas las columnas de una tabla.',
    unlocks:['move'],
    goal:{ type:'use_cmd', cmd:'SELECT * FROM mapa', count:1 }, progress:0, done:false
  },
  {
    id:'move', zone:'Caverna Inicial', zoneColor:'#4ec9b0',
    title:'UPDATE básico', short:'UPDATE SET',
    mission:"Muévete con: UPDATE héroe SET posición = 'norte';",
    hint:"Para moverte usa UPDATE héroe SET posición = '[dirección]'; — dirección puede ser norte, sur, este, oeste",
    template:"UPDATE héroe SET posición = 'norte';",
    teaches:"UPDATE tabla SET columna = valor — modifica datos. Aquí cambia tu posición.",
    unlocks:['sel_col'],
    goal:{ type:'steps', count:3 }, progress:0, done:false
  },
  {
    id:'sel_col', zone:'Pasillos de Datos', zoneColor:'#70a0e0',
    title:'SELECT columnas', short:'SELECT col',
    mission:'Consulta tus stats: SELECT hp FROM héroes;',
    hint:'Puedes seleccionar columnas específicas: SELECT hp FROM héroes; o SELECT atk FROM héroes;',
    template:'SELECT hp FROM héroes;',
    teaches:'SELECT columna FROM tabla — devuelve solo esa columna, más eficiente que SELECT *.',
    unlocks:['where'],
    goal:{ type:'use_cmd', cmd:'SELECT hp FROM', count:1 }, progress:0, done:false
  },
  {
    id:'where', zone:'Pasillos de Datos', zoneColor:'#70a0e0',
    title:'WHERE — Filtrar', short:'WHERE',
    mission:"Busca enemigos peligrosos: SELECT * FROM enemigos WHERE atk > 5;",
    hint:"WHERE filtra resultados. Prueba: SELECT * FROM enemigos WHERE atk > 5;",
    template:"SELECT * FROM enemigos WHERE atk > 5;",
    teaches:"WHERE condición — filtra filas que cumplen la condición. Puedes usar >, <, =, !=.",
    unlocks:['combat','count'],
    goal:{ type:'use_cmd', cmd:'WHERE', count:1 }, progress:0, done:false
  },
  {
    id:'combat', zone:'Arena de Combate', zoneColor:'#e07070',
    title:'INSERT — Atacar', short:'INSERT',
    mission:'Derrota un enemigo con: INSERT INTO ataque VALUES (espada);',
    hint:'INSERT INTO ataque VALUES (espada); — usa tus armas contra el enemigo',
    template:"INSERT INTO ataque VALUES ('espada');",
    teaches:"INSERT INTO tabla VALUES (...) — añade una nueva fila. Aquí lanza un ataque.",
    unlocks:['delete_combat','update_heal'],
    goal:{ type:'kills', count:1 }, progress:0, done:false
  },
  {
    id:'count', zone:'Pasillos de Datos', zoneColor:'#70a0e0',
    title:'COUNT — Contar', short:'COUNT(*)',
    mission:'Cuenta los enemigos: SELECT COUNT(*) FROM enemigos;',
    hint:'SELECT COUNT(*) FROM tabla; — devuelve el número de filas.',
    template:'SELECT COUNT(*) FROM enemigos;',
    teaches:'COUNT(*) es una función de agregación que cuenta filas.',
    unlocks:[],
    goal:{ type:'use_cmd', cmd:'COUNT', count:1 }, progress:0, done:false
  },
  {
    id:'delete_combat', zone:'Arena de Combate', zoneColor:'#e07070',
    title:'DELETE — Huir', short:'DELETE',
    mission:'Si el combate es difícil: DELETE FROM combate WHERE id = héroe;',
    hint:'DELETE FROM combate WHERE id = héroe; — elimina tu fila del combate (huyes)',
    template:'DELETE FROM combate WHERE id = héroe;',
    teaches:"DELETE FROM tabla WHERE condición — elimina filas que cumplen la condición.",
    unlocks:['join'],
    goal:{ type:'use_cmd', cmd:'DELETE FROM combate', count:1 }, progress:0, done:false
  },
  {
    id:'update_heal', zone:'Arena de Combate', zoneColor:'#e07070',
    title:'UPDATE — Curar', short:'UPDATE hp',
    mission:'Cúrate con: UPDATE héroes SET hp = hp + 30 WHERE id = 1;',
    hint:'UPDATE héroes SET hp = hp + 30 WHERE id = 1; — incrementa tu HP usando una poción',
    template:'UPDATE héroes SET hp = hp + 30 WHERE id = 1;',
    teaches:"UPDATE con WHERE actualiza solo las filas que cumplen la condición.",
    unlocks:['join'],
    goal:{ type:'use_cmd', cmd:'UPDATE héroes SET hp', count:1 }, progress:0, done:false
  },
  {
    id:'join', zone:'Cámara del Tesoro', zoneColor:'#e0c070',
    title:'JOIN — Relacionar', short:'JOIN',
    mission:'Consulta objetos: SELECT i.nombre, i.atk FROM inventario i JOIN armas a ON i.id = a.id;',
    hint:'JOIN combina dos tablas por una columna en común.',
    template:'SELECT nombre, atk FROM inventario JOIN armas ON inventario.id = armas.id;',
    teaches:"JOIN une dos tablas donde las columnas relacionadas coinciden.",
    unlocks:['order'],
    goal:{ type:'use_cmd', cmd:'JOIN', count:1 }, progress:0, done:false
  },
  {
    id:'order', zone:'Cámara del Tesoro', zoneColor:'#e0c070',
    title:'ORDER BY — Ordenar', short:'ORDER BY',
    mission:'Ordena tu inventario: SELECT * FROM inventario ORDER BY val DESC;',
    hint:'ORDER BY columna DESC — ordena de mayor a menor.',
    template:'SELECT * FROM inventario ORDER BY val DESC;',
    teaches:"ORDER BY columna ASC|DESC — ordena los resultados.",
    unlocks:['group'],
    goal:{ type:'use_cmd', cmd:'ORDER BY', count:1 }, progress:0, done:false
  },
  {
    id:'group', zone:'Sala del Conocimiento', zoneColor:'#b080f0',
    title:'GROUP BY — Agrupar', short:'GROUP BY',
    mission:'Agrupa por tipo: SELECT tipo, COUNT(*) FROM inventario GROUP BY tipo;',
    hint:'GROUP BY agrupa filas con el mismo valor y aplica funciones de agregación.',
    template:'SELECT tipo, COUNT(*) FROM inventario GROUP BY tipo;',
    teaches:"GROUP BY columna — agrupa filas idénticas para usar con COUNT, SUM, AVG.",
    unlocks:['subquery'],
    goal:{ type:'use_cmd', cmd:'GROUP BY', count:1 }, progress:0, done:false
  },
  {
    id:'subquery', zone:'Sala del Conocimiento', zoneColor:'#b080f0',
    title:'Subconsulta', short:'SUBQUERY',
    mission:"Encuentra al enemigo más fuerte: SELECT * FROM enemigos WHERE atk = (SELECT MAX(atk) FROM enemigos);",
    hint:'Una subconsulta es un SELECT dentro de otro SELECT.',
    template:'SELECT * FROM enemigos WHERE atk = (SELECT MAX(atk) FROM enemigos);',
    teaches:"Una subconsulta (subquery) es un SELECT anidado que actúa como valor o tabla.",
    unlocks:[],
    goal:{ type:'use_cmd', cmd:'SELECT MAX', count:1 }, progress:0, done:false
  },
];

// ════════════════════════════════════════════════════
// CONSTANTS & RNG
// ════════════════════════════════════════════════════
const GRID=10, CELL=32;
const T={FLOOR:0,WALL:1,ENEMY:2,TREASURE:3,WEAPON:4,ARMOR:5,POTION:6,EXIT:7,KEY:8};

function makeRng(seed){
  let s=seed>>>0;
  return ()=>{ s+=0x6D2B79F5; let t=s; t=Math.imul(t^(t>>>15),1|t); t^=t+Math.imul(t^(t>>>7),61|t); return((t^(t>>>14))>>>0)/0xFFFFFFFF; };
}
let rng=makeRng(Date.now()), currentSeed=Date.now();

// ════════════════════════════════════════════════════
// PIXEL ART TILES (unchanged from v2)
// ════════════════════════════════════════════════════
const TA={
  floor(ctx,x,y,r){
    const px=x*CELL,py=y*CELL;
    ctx.fillStyle='#0e0e1a'; ctx.fillRect(px,py,CELL,CELL);
    const nc=['#111120','#0d0d18','#131325','#0f0f1c'];
    for(let dy=0;dy<CELL;dy+=4)for(let dx=0;dx<CELL;dx+=4){const n=Math.floor(r()*4);if(n>0){ctx.fillStyle=nc[n];ctx.fillRect(px+dx,py+dy,4,4);}}
    if(r()<0.15){ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;ctx.beginPath();const sx=px+Math.floor(r()*CELL),sy=py+Math.floor(r()*CELL);ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.floor((r()-.5)*12),sy+Math.floor((r()-.5)*12));ctx.stroke();}
  },
  wall(ctx,x,y,r){
    const px=x*CELL,py=y*CELL;

// MAP GENERATION (BSP)
// ════════════════════════════════════════════════════
function generateMap(seed){
  rng=makeRng(seed); currentSeed=seed;
  const map=[];
  for(let r=0;r<GRID;r++){map.push([]);for(let c=0;c<GRID;c++)map[r].push(T.WALL);}
  const rooms=[];
  function split(x,y,w,h,d){
    if(d<=0||w<4||h<4){
      const rw=Math.floor(rng()*(w-2))+2,rh=Math.floor(rng()*(h-2))+2;
      const rx=x+Math.floor(rng()*(w-rw)),ry=y+Math.floor(rng()*(h-rh));
      rooms.push({x:rx,y:ry,w:rw,h:rh});
      for(let r2=ry;r2<ry+rh&&r2<GRID;r2++)for(let c2=rx;c2<rx+rw&&c2<GRID;c2++)map[r2][c2]=T.FLOOR;
      return{x:rx,y:ry,w:rw,h:rh};
    }
    let r1,r2;
    if(w>h){const sp=Math.floor(rng()*(w-3))+2;r1=split(x,y,sp,h,d-1);r2=split(x+sp,y,w-sp,h,d-1);}
    else{const sp=Math.floor(rng()*(h-3))+2;r1=split(x,y,w,sp,d-1);r2=split(x,y+sp,w,h-sp,d-1);}
    const c1x=Math.floor(r1.x+r1.w/2),c1y=Math.floor(r1.y+r1.h/2),c2x=Math.floor(r2.x+r2.w/2),c2y=Math.floor(r2.y+r2.h/2);
    for(let c=Math.min(c1x,c2x);c<=Math.max(c1x,c2x);c++)if(c1y>=0&&c1y<GRID&&c>=0&&c<GRID)map[c1y][c]=T.FLOOR;
    for(let r=Math.min(c1y,c2y);r<=Math.max(c1y,c2y);r++)if(r>=0&&r<GRID&&c2x>=0&&c2x<GRID)map[r][c2x]=T.FLOOR;
    return{x:Math.min(r1.x,r2.x),y:Math.min(r1.y,r2.y),w:Math.max(r1.x+r1.w,r2.x+r2.w)-Math.min(r1.x,r2.x),h:Math.max(r1.y+r1.h,r2.y+r2.h)-Math.min(r1.y,r2.y)};
  }
  split(0,0,GRID,GRID,3);
  if(rooms.length<3){
    [[1,1,3,3],[1,5,3,3],[5,1,3,3],[5,5,3,3],[3,3,4,4]].forEach(([ry,rx,rh,rw])=>{for(let r2=ry;r2<ry+rh&&r2<GRID;r2++)for(let c2=rx;c2<rx+rw&&c2<GRID;c2++)map[r2][c2]=T.FLOOR;rooms.push({x:rx,y:ry,w:rw,h:rh});});
    for(let c=3;c<7;c++){map[3][c]=T.FLOOR;map[6][c]=T.FLOOR;}
    for(let r2=3;r2<7;r2++){map[r2][3]=T.FLOOR;map[r2][6]=T.FLOOR;}
  }
  return{map,rooms};
}

function placeObjects(map,rooms,seed){
  rng=makeRng(seed+1);
  const objects={};
  const floors=[];
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)if(map[r][c]===T.FLOOR)floors.push([r,c]);
  const pick=()=>{if(!floors.length)return null;const i=Math.floor(rng()*floors.length);return floors.splice(i,1)[0];};
  let heroStart=[GRID-1,0];
  if(rooms.length>0){const rm=rooms[0];heroStart=[Math.min(Math.floor(rm.y+rm.h/2),GRID-1),Math.min(Math.floor(rm.x+rm.w/2),GRID-1)];const idx=floors.findIndex(([fr,fc])=>fr===heroStart[0]&&fc===heroStart[1]);if(idx>=0)floors.splice(idx,1);}
  if(rooms.length>1){const rm=rooms[rooms.length-1];const ep=[Math.min(Math.floor(rm.y+rm.h/2),GRID-1),Math.min(Math.floor(rm.x+rm.w/2),GRID-1)];const idx=floors.findIndex(([fr,fc])=>fr===ep[0]&&fc===ep[1]);if(idx>=0)floors.splice(idx,1);map[ep[0]][ep[1]]=T.EXIT;}
  else{const p=pick();if(p)map[p[0]][p[1]]=T.EXIT;}
  const kr=rooms[Math.floor(rooms.length/2)];
  if(kr){const kry=Math.min(Math.floor(kr.y+kr.h/2),GRID-1),krc=Math.min(Math.floor(kr.x+kr.w/2),GRID-1);if(map[kry][krc]===T.FLOOR){map[kry][krc]=T.KEY;objects[`${kry},${krc}`]={name:'Llave Dorada',type:'key',val:0};const idx=floors.findIndex(([fr,fc])=>fr===kry&&fc===krc);if(idx>=0)floors.splice(idx,1);}}
  else{const p=pick();if(p){map[p[0]][p[1]]=T.KEY;objects[`${p[0]},${p[1]}`]={name:'Llave Dorada',type:'key',val:0};}}
// Verificar distancia mínima del hérone
  function isFarEnough(px,py,hx,hy,minDist){
    return Math.abs(px-hx)+Math.abs(py-hy)>=minDist;
  }
  
  // Spawn enemigos a distancia mínima de 2 del hérone
  let placedEnemies=0;
  while(placedEnemies<4){
    const p=pick();
    if(!p)break;
    const [py,px]=p;
    if(!isFarEnough(px,py,heroStart[1],heroStart[0],2)){
      floors.push(p); continue;
    }
    map[py][px]=T.ENEMY;
    objects[`${py},${px}`]={...ENEMIES[Math.floor(rng()*ENEMIES.length)]};
    placedEnemies++;
  }
  
  // Spawn items a distancia mínima de 2 del hérone
  [T.WEAPON,T.ARMOR,T.POTION,T.TREASURE,T.POTION,T.WEAPON].forEach(tp=>{
    let attempts=0;
    while(attempts<10){
      const p=pick();
      if(!p)break;
      const [py,px]=p;
      if(!isFarEnough(px,py,heroStart[1],heroStart[0],2)){
        attempts++; continue;
      }
      map[py][px]=tp;
      if(ITEMS[tp])objects[`${py},${px}`]={...ITEMS[tp][Math.floor(rng()*ITEMS[tp].length)]};
      break;
    }
  });
  return{objects,heroStart};
}
  
  // Spawn enemigos a distancia mínima de 2
  for(let i=0;i<4;i++){
    const p=pick();
    if(!p)break;
    const [py,px]=p;
    if(!isFarEnough(px,py,heroStart[1],heroStart[0],2)){
      floors.push(p); continue;
    }
    map[py][px]=T.ENEMY;
    objects[`${py},${px}`]={...ENEMIES[Math.floor(rng()*ENEMIES.length)]};
  }
  
  [T.WEAPON,T.ARMOR,T.POTION,T.TREASURE,T.POTION,T.WEAPON].forEach(tp=>{const p=pick();if(!p)return;map[p[0]][p[1]]=tp;if(ITEMS[tp])objects[`${p[0]},${p[1}`]={...ITEMS[tp][Math.floor(rng()*ITEMS[tp].length)]};});
  return{objects,heroStart};
}

// ════════════════════════════════════════════════════
// CURRICULUM LOGIC
// ════════════════════════════════════════════════════
function initCurriculum(){
  currProgress={};
  CURRICULUM.forEach(l=>{ currProgress[l.id]={ done:false, progress:0 }; });
  activeLessonIdx=0;
}

function getActiveLesson(){ return CURRICULUM[activeLessonIdx]||null; }

function isLessonUnlocked(id){
  if(id===CURRICULUM[0].id) return true;
  return CURRICULUM.some(l=>l.done && l.unlocks&&l.unlocks.includes(id));
}

function advanceCurriculum(){
  // find next undone unlocked lesson
  for(let i=0;i<CURRICULUM.length;i++){
    if(!currProgress[CURRICULUM[i].id]?.done && isLessonUnlocked(CURRICULUM[i].id)){
      activeLessonIdx=i; break;
    }
  }
  renderCurriculum();
  updateMission();
}

function checkCurriculumGoal(lessonId, cmdUpper, extra={}){
  const lesson=CURRICULUM.find(l=>l.id===lessonId);
  if(!lesson||currProgress[lessonId]?.done) return;
  if(!isLessonUnlocked(lessonId)) return;
  const g=lesson.goal;
  let met=false;
  if(g.type==='use_cmd' && cmdUpper.includes(g.cmd.toUpperCase())) met=true;
  if(g.type==='steps' && hero.steps>=g.count) met=true;
  if(g.type==='kills' && hero.kills>=g.count) met=true;
  if(met){
    currProgress[lessonId].done=true;
    lesson.done=true;
    addLog(`📖 ¡Lección completada: ${lesson.title}!`,'lrew');
    addLog(`   ${lesson.teaches}`,'lcmd');
    advanceCurriculum();
  }
}

function tickCurriculumSteps(){
  CURRICULUM.forEach(l=>{
    if(l.goal.type==='steps' && isLessonUnlocked(l.id)) checkCurriculumGoal(l.id,'',{});
    if(l.goal.type==='kills'  && isLessonUnlocked(l.id)) checkCurriculumGoal(l.id,'',{});
  });
}

function renderCurriculum(){
  const el=document.getElementById('curr-steps');
  el.innerHTML=CURRICULUM.map((l,i)=>{
    const done=currProgress[l.id]?.done;
    const active=i===activeLessonIdx&&!done;
    const locked=!isLessonUnlocked(l.id);
    const cls=done?'cs done':active?'cs active':locked?'cs locked':'cs';
    const icon=done?'✓':active?'▶':locked?'🔒':'○';
    return `<div class="${cls}" title="${l.teaches}">${icon} ${l.short}</div>`;
  }).join('');
}

function updateMission(){
  const l=getActiveLesson();
  if(!l){ document.getElementById('mission-text').textContent='¡Has completado todas las lecciones!'; document.getElementById('mission-sql').textContent=''; return; }
  document.getElementById('zone-name').textContent=l.zone;
  document.getElementById('mission-text').textContent=l.mission;
  document.getElementById('mission-sql').textContent=`💡 ${l.template}`;
  // contextual hint
  setCtxHint(l.hint, true);
}

// AUTOCOMPLETE ENGINE
// ════════════════════════════════════════════════════
function getUnlockedSQLs(){
  return AC_CATALOG.filter(e=>{
    if(!e.lesson) return true;
    const lessonIdx=CURRICULUM.findIndex(l=>l.id===e.lesson);
    return isLessonUnlocked(e.lesson) || lessonIdx<=activeLessonIdx+1; // show next too
  });
}

function buildAC(val){
  const v=val.trim().toUpperCase();
  const pool=getUnlockedSQLs();
  if(!v){ acFiltered=[]; renderAC(); return; }
  acFiltered=pool.filter(e=>e.sql.toUpperCase().includes(v)).slice(0,8);
  // also show locked hints
  if(acFiltered.length<4){
    const locked=AC_CATALOG.filter(e=>e.lesson&&!isLessonUnlocked(e.lesson)&&e.sql.toUpperCase().includes(v)).slice(0,2);
    locked.forEach(e=>acFiltered.push({...e,_locked:true}));
  }
  acSelIdx=-1;
  renderAC();
}

function renderAC(){
  const el=document.getElementById('ac-list');
  if(!acFiltered.length){ el.classList.remove('open'); return; }
  el.innerHTML=acFiltered.map((e,i)=>{
    const cls='ac-item'+(e._locked?' locked':'')+(i===acSelIdx?' sel':'');
    const lock=e._locked?'🔒 ':'';
    return `<div class="${cls}" data-i="${i}">
      <span class="ac-sql">${lock}${e.sql}</span>
      <span class="ac-desc">${e.desc}</span>
    </div>`;
  }).join('');
  el.classList.add('open');
  el.querySelectorAll('.ac-item:not(.locked)').forEach(el2=>{
    el2.addEventListener('mousedown',ev=>{ev.preventDefault();const i=+el2.dataset.i;selectAC(i);});
  });
}

function selectAC(i){
  const e=acFiltered[i];
  if(!e||e._locked) return;
  document.getElementById('cmd').value=e.sql;
  document.getElementById('ac-list').classList.remove('open');
  acFiltered=[];acSelIdx=-1;
  document.getElementById('cmd').focus();
}

function acMoveSelect(dir){
  if(!acFiltered.length) return;
  acSelIdx=(acSelIdx+dir+acFiltered.length)%acFiltered.length;
  renderAC();
  const el=document.getElementById('ac-list');
  const sel=el.querySelector('.sel');
  if(sel) sel.scrollIntoView({block:'nearest'});
}

// ════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════
let lastFrame=0;
function render(t=0){
  requestAnimationFrame(render);
  if(t-lastFrame<50) return; lastFrame=t;
  const canvas=document.getElementById('mapCanvas');
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const tile=map[r][c], tr=tileSeeds[r][c];
    if(tile===T.WALL){ TA.wall(ctx,c,r,tr); continue; }
    TA.floor(ctx,c,r,tr);
    if(tile===T.ENEMY)    TA.enemy(ctx,c,r);
    else if(tile===T.TREASURE) TA.treasure(ctx,c,r);
    else if(tile===T.WEAPON)   TA.weapon(ctx,c,r);
    else if(tile===T.ARMOR)    TA.armor(ctx,c,r);
    else if(tile===T.POTION)   TA.potion(ctx,c,r);
    else if(tile===T.EXIT)     TA.exit(ctx,c,r);
    else if(tile===T.KEY)      TA.key(ctx,c,r);
  }
  TA.floor(ctx,hero.x,hero.y,tileSeeds[hero.y][hero.x]);
  TA.hero(ctx,hero.x,hero.y);
  ctx.strokeStyle='rgba(78,201,176,0.05)'; ctx.lineWidth=1;
  for(let r=0;r<=GRID;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(GRID*CELL,r*CELL);ctx.stroke();}
  for(let c=0;c<=GRID;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,GRID*CELL);ctx.stroke();}
  // fog
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    if(!visitedCells.has(`${r},${c}`)&&map[r][c]!==T.WALL){ ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2); }
  }
  // combat animations
  if(combatAnim){
    const elapsed=Date.now()-combatAnim.start;
    if(elapsed<combatAnim.duration){
      const progress=elapsed/combatAnim.duration;
      const {type,x,y,text}=combatAnim;
      const px=x*CELL+CELL/2, py=y*CELL+CELL/2;
      ctx.globalAlpha=1-progress;
      if(type==='attack'){
        ctx.strokeStyle='#ff4444'; ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(px,py,8+progress*16,0,Math.PI*2);ctx.stroke();
      } else if(type==='hit'){
        ctx.fillStyle='#ff4444'; ctx.font='bold 20px monospace';
        ctx.fillText('💥',px-10,py-10-progress*20);
      } else if(type==='death'){
        ctx.fillStyle='#444'; ctx.font='bold 24px monospace';
        ctx.fillText('💀',px-12,py-12-progress*30);
      } else if(type==='heal'){
        ctx.fillStyle='#40e080'; ctx.font='bold 20px monospace';
        ctx.fillText('❤️',px-10,py-10-progress*20);
      }
      if(text){
        ctx.fillStyle=type==='heal'?'#40e080':type==='death'?'#ff4444':'#ffaa00';
        ctx.font='bold 14px monospace';
        ctx.fillText(text,px-ctx.measureText(text).width/2,py-25-progress*30);
      }
      ctx.globalAlpha=1;
    } else {
      combatAnim=null;
    }
  }
}

function initTileSeeds(){
  tileSeeds=[];
  for(let r=0;r<GRID;r++){ tileSeeds.push([]); for(let c=0;c<GRID;c++) tileSeeds[r].push(makeRng(currentSeed^(r*997+c*31))); }
}

function revealAround(x,y){
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<GRID&&ny>=0&&ny<GRID)visitedCells.add(`${ny},${nx}`);}
}

// ════════════════════════════════════════════════════
// MOVEMENT & COMBAT
// ════════════════════════════════════════════════════
const DIRS={norte:[0,-1],sur:[0,1],este:[1,0],oeste:[-1,0]};

function getAdjacentEnemy(){
  for(const[,[dx,dy]] of Object.entries(DIRS)){
    const nx=hero.x+dx,ny=hero.y+dy;
    if(nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&map[ny][nx]===T.ENEMY){
      return {x:nx,y:ny,e:objects[`${ny},${nx}`]};
    }
  }
  return null;
}

function getCellInfo(){
  return Object.entries(DIRS).filter(([, [dx,dy]])=>{const nx=hero.x+dx,ny=hero.y+dy;return nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&map[ny][nx]!==T.WALL;}).map(([d])=>`'${d}'`);
}

function handleMove(dir){
  if(!DIRS[dir]){addLog(`Dirección inválida. Usa norte, sur, este u oeste.`,'lerr');return;}
  if(currentEnemy){addLog(`¡Estás en combate! Usa INSERT INTO ataque o DELETE FROM combate.`,'lerr');return;}
  const[dx,dy]=DIRS[dir];
  const nx=hero.x+dx,ny=hero.y+dy;
  if(nx<0||nx>=GRID||ny<0||ny>=GRID){addLog('¡Fuera del mapa!','lerr');return;}
  if(map[ny][nx]===T.WALL){addLog('¡Hay una pared en esa dirección!','lerr');return;}
  hero.x=nx;hero.y=ny;hero.steps++;
  revealAround(nx,ny);
  tickCurriculumSteps();
  const cell=map[ny][nx],key=`${ny},${nx}`;
  if(cell===T.KEY){
    const obj=objects[key];inventory.push(obj);
    addLog(`🔑 ¡Llave Dorada encontrada! Ve a la salida.`,'lrew');
    map[ny][nx]=T.FLOOR;delete objects[key];
  } else if([T.WEAPON,T.ARMOR,T.POTION,T.TREASURE].includes(cell)){
    const obj=objects[key];
    if(obj){
      if(obj.type==='gold'){hero.gold+=obj.val;hero.chests++;addLog(`💰 ${obj.name} +${obj.val}oro`,'lrew');}
      else if(obj.type==='potion'){inventory.push(obj);addLog(`🧪 Guardaste ${obj.name}`,'lok');}
      else{inventory.push(obj);if(obj.atk){hero.atk=Math.max(hero.atk,obj.atk);addLog(`⚔ Equipaste ${obj.name} ATK→${hero.atk}`,'lok');}if(obj.def){hero.def+=obj.def;addLog(`🛡 ${obj.name} DEF+${obj.def}`,'lok');}}
      map[ny][nx]=T.FLOOR;delete objects[key];
    }
  } else if(cell===T.EXIT){
    if(inventory.some(i=>i.type==='key')){addLog('🏆 ¡Usaste la llave! ¡VICTORIA! Inicia un nuevo mapa.','lrew');}
    else{addLog('🔒 Necesitas la Llave Dorada.','lerr');hero.x-=dx;hero.y-=dy;}
  } else {
    const adj=getCellInfo();
    const adjEnemy=getAdjacentEnemy();
    if(adjEnemy){
      addLog(`→ Movido al ${dir}. Pos(${nx},${ny}) | ⚔ ${adjEnemy.e.name} adyacente (HP:${adjEnemy.e.hp})`,'lok');
    } else {
      addLog(`→ Movido al ${dir}. Pos(${nx},${ny})`,'lok');
    }
    setCtxHint(`Caminos disponibles: ${adj.join(', ')} | Usa SELECT * FROM mapa; para más info`);
  }
  updateStats();
}

function handleAttack(){
  const adjEnemy=getAdjacentEnemy();
  if(!adjEnemy){addLog('No hay enemigo adyacente. Acércate para combatir.','lerr');return;}
  const e=adjEnemy.e, ex=adjEnemy.x, ey=adjEnemy.y;
  addCombatAnim('attack',ex,ey,`-${hero.atk+Math.floor(Math.random()*5)}`);
  const dmg=hero.atk+Math.floor(Math.random()*5);
  e.hp-=dmg;
  addLog(`⚔ Atacaste a ${e.name} por ${dmg}dmg (HP:${Math.max(0,e.hp)})`,'lok');
  if(e.hp<=0){
    addCombatAnim('death',ex,ey,'💀');
    setTimeout(()=>{
      addLog(`✅ ¡${e.name} derrotado! +${e.xp}XP +${e.gold}💰`,'lrew');
      hero.xp+=e.xp;hero.gold+=e.gold;hero.kills++;
      map[ey][ex]=T.FLOOR;delete objects[`${ey},${ex}`];
      currentEnemy=null;
      if(hero.xp>=hero.xpNext){hero.xp-=hero.xpNext;hero.lvl++;hero.xpNext=Math.floor(hero.xpNext*1.6);hero.maxHp+=20;hero.hp=hero.maxHp;hero.atk+=3;addLog(`⬆ ¡Nivel ${hero.lvl}!`,'lrew');}
      tickCurriculumSteps();
      const l=getActiveLesson();if(l) setCtxHint(l.hint,true);
    },600);
  } else {
    const edmg=Math.max(1,e.atk-hero.def+Math.floor(Math.random()*4));
    hero.hp=Math.max(0,hero.hp-edmg);
    addCombatAnim('hit',hero.x,hero.y,`-${edmg}`);
    addLog(`💥 ${e.name} te golpeó por ${edmg}. HP: ${hero.hp}/${hero.maxHp}`,hero.hp<30?'lerr':'');
    if(hero.hp===0){addCombatAnim('death',hero.x,hero.y,'💀');addLog('💀 Derrotado. Carga o inicia nuevo mapa.','lerr');setTimeout(()=>currentEnemy=null,600);}
  }
  updateStats();
}

function handleHeal(){
  const pot=inventory.find(i=>i.type==='potion');
  if(!pot){addLog('No tienes pociones.','lerr');return;}
  inventory.splice(inventory.indexOf(pot),1);
  const oldHp=hero.hp;
  hero.hp=Math.min(hero.maxHp,hero.hp+pot.hp);
  const healed=hero.hp-oldHp;
  addCombatAnim('heal',hero.x,hero.y,`+${healed}`);
  addLog(`🧪 ${pot.name} usado. HP→${hero.hp}/${hero.maxHp}`,'lok');
  updateStats();
}

// ════════════════════════════════════════════════════
// SQL PARSER — single source of truth
// ════════════════════════════════════════════════════
function ejecutar(){
  const raw=document.getElementById('cmd').value.trim();
  document.getElementById('cmd').value='';
  document.getElementById('ac-list').classList.remove('open');
  acFiltered=[];
  if(!raw) return;
  const sql=raw.toUpperCase();
  addLog(`<span style="color:#333">> ${raw}</span>`);

  // ── SELECT * FROM mapa
  if(/SELECT \* FROM (MAPA|MAP)/.test(sql)){
    const adj=getCellInfo();
    const adjEnemy=getAdjacentEnemy();
    let msg=`📍 Pos(${hero.x},${hero.y}) — Caminos: ${adj.join(', ')||'ninguno (bloqueado)'}`;
    if(adjEnemy) msg+=` | ⚔ Enemigo adyacente: ${adjEnemy.e.name}(HP:${adjEnemy.e.hp})`;
    const obj=objects[`${hero.y},${hero.x}`];
    if(obj) msg+=` | ✨ ${obj.name}`;
    if(map[hero.y][hero.x]===T.EXIT) msg+=' | 🚪 SALIDA';
    addLog(msg,'linfo');
    checkCurriculumGoal('sel_star',sql);
    return;
  }

  // ── SELECT columnas específicas FROM héroes
  const colMatch=raw.match(/^SELECT\s+(\w+)\s+FROM\s+(h[eé]roes?|hero)/i);
  if(colMatch){
    const col=colMatch[1].toLowerCase();
    const vals={hp:`HP: ${hero.hp}/${hero.maxHp}`,atk:`ATK: ${hero.atk}`,def:`DEF: ${hero.def}`,gold:`Oro: ${hero.gold}`,level:`Nivel: ${hero.lvl}`,nivel:`Nivel: ${hero.lvl}`};
    if(col==='*')addLog(`HP:${hero.hp}/${hero.maxHp} ATK:${hero.atk} DEF:${hero.def} Lvl:${hero.lvl} Oro:${hero.gold}`,'linfo');
    else if(vals[col])addLog(vals[col],'linfo');
    else addLog(`Columna '${col}' no existe en héroes.`,'lerr');
    checkCurriculumGoal('sel_star',sql);
    checkCurriculumGoal('sel_col',sql);
    return;
  }

  // ── SELECT * FROM héroes
  if(/SELECT \* FROM (H[EÉ]ROES?|HERO)/.test(sql)){
    addLog(`HP:${hero.hp}/${hero.maxHp} | ATK:${hero.atk} | DEF:${hero.def} | Lvl:${hero.lvl} | XP:${hero.xp}/${hero.xpNext} | Oro:${hero.gold}`,'linfo');
    checkCurriculumGoal('sel_star',sql);
    return;
  }

  // ── SELECT * FROM inventario
  if(/SELECT .* FROM INVENTARIO/.test(sql)){
    addLog(inventory.length?'Inventario: '+inventory.map(i=>i.name).join(', '):'Inventario vacío.','linfo');
    checkCurriculumGoal('sel_col',sql);
    return;
  }

  // ── WHERE queries
  if(/WHERE/.test(sql)){
    if(/ENEMIGOS/.test(sql)){
      let n=0;for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)if(map[r][c]===T.ENEMY)n++;
      if(/ATK\s*>\s*(\d+)/.test(sql)){const th=+sql.match(/ATK\s*>\s*(\d+)/)[1];addLog(`Enemigos con ATK>${th}: hay ${n} en el mapa.`,'linfo');}
      else if(/HP\s*<\s*(\d+)/.test(sql)){addLog(`Enemigos con HP bajo: ${n} activos.`,'linfo');}
      else addLog(`Consulta WHERE aplicada: ${n} enemigos activos.`,'linfo');
      checkCurriculumGoal('where',sql);
    } else if(/H[EÉ]ROES?/.test(sql)){
      if(/HP\s*<\s*(\d+)/.test(sql)){const th=+sql.match(/HP\s*<\s*(\d+)/)[1];addLog(hero.hp<th?`Héroe en peligro (HP:${hero.hp})`:'Héroe fuera de peligro.','linfo');}
      checkCurriculumGoal('where',sql);
    } else { addLog('WHERE procesado.','linfo'); checkCurriculumGoal('where',sql); }
    return;
  }

  // ── COUNT
  if(/COUNT/.test(sql)){
    if(/ENEMIGOS/.test(sql)){let n=0;for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++)if(map[r][c]===T.ENEMY)n++;addLog(`COUNT(*): ${n} enemigos.`,'linfo');}
    else if(/INVENTARIO/.test(sql))addLog(`COUNT(*): ${inventory.length} objetos.`,'linfo');
    else addLog(`COUNT(*): consulta ejecutada.`,'linfo');
    checkCurriculumGoal('count',sql);
    return;
  }

  // ── ORDER BY
  if(/ORDER BY/.test(sql)){
    const sorted=[...inventory].sort((a,b)=>b.val-a.val);
    addLog(sorted.length?'Inventario (desc val): '+sorted.map(i=>`${i.name}(${i.val})`).join(', '):'Inventario vacío.','linfo');
    checkCurriculumGoal('order',sql);
    return;
  }

  // ── GROUP BY
  if(/GROUP BY/.test(sql)){
    const groups={};inventory.forEach(i=>{groups[i.type]=(groups[i.type]||0)+1;});
    const res=Object.entries(groups).map(([k,v])=>`${k}:${v}`).join(', ')||'Inventario vacío';
    addLog(`GROUP BY tipo: ${res}`,'linfo');
    checkCurriculumGoal('group',sql);
    return;
  }

  // ── JOIN
  if(/JOIN/.test(sql)){
    const weapons=inventory.filter(i=>i.atk);
    addLog(weapons.length?'JOIN inventario⟶armas: '+weapons.map(i=>`${i.name}(ATK:${i.atk})`).join(', '):'No tienes armas equipadas.','linfo');
    checkCurriculumGoal('join',sql);
    return;
  }

  // ── SUBQUERY / MAX
  if(/SELECT MAX|SUBQUERY/.test(sql)||/SELECT .* WHERE .* SELECT/.test(sql)){
    let maxAtk=0,maxName='—';
    Object.values(objects).forEach(o=>{if(o.atk&&o.atk>maxAtk){maxAtk=o.atk;maxName=o.name;}});
    if(currentEnemy&&currentEnemy.atk>maxAtk){maxAtk=currentEnemy.atk;maxName=currentEnemy.name;}
    addLog(`MAX(atk): ${maxName} con ATK ${maxAtk}`,'linfo');
    checkCurriculumGoal('subquery',sql);
    return;
  }

  // ── UPDATE héroe (mover)
  const moveM=raw.match(/UPDATE\s+h[eé]roe[s]?\s+SET\s+(?:posici[oó]n|pos)\s*=\s*['"]?(norte|sur|este|oeste)['"]?\s*;?/i);
  if(moveM){ handleMove(moveM[1].toLowerCase()); checkCurriculumGoal('move',sql); return; }

  // ── INSERT ataque
  if(/INSERT\s+INTO\s+ataque/.test(sql)){ handleAttack(); checkCurriculumGoal('combat',sql); return; }

  // ── UPDATE hp (curar)
  if(/UPDATE\s+H[EÉ]ROES?\s+SET\s+HP\s*=\s*HP\s*\+/.test(sql)){ handleHeal(); checkCurriculumGoal('update_heal',sql); return; }

  // ── DELETE combate (huir)
  if(/DELETE\s+FROM\s+COMBATE/.test(sql)){
    if(currentEnemy){addLog(`Huiste de ${currentEnemy.name}.`,'linfo');currentEnemy=null;hero.x=Math.max(0,hero.x-1);updateStats();}
    else addLog('No estás en combate.','lerr');
    checkCurriculumGoal('delete_combat',sql);
    return;
  }

  // ── Error con sugerencia contextual
  const l=getActiveLesson();
  addLog(`Error SQL: comando no reconocido.`,'lerr');
  if(l) addLog(`💡 Misión actual: ${l.template}`,'lcmd');
}

function saveGame(){
  localStorage.setItem('sqlquest_v3',JSON.stringify({hero,inventory,map,objects,currentSeed,visited:[...visitedCells],currProgress,activeLessonIdx}));
  addLog('💾 Guardado.','lok');
}
function loadGame(){
  const d=JSON.parse(localStorage.getItem('sqlquest_v3')||'null');
  if(!d){addLog('No hay partida guardada.','lerr');return;}
  Object.assign(hero,d.hero);inventory=d.inventory||[];map=d.map||[];objects=d.objects||{};
  currentSeed=d.currentSeed||Date.now();visitedCells=new Set(d.visited||[]);
  currProgress=d.currProgress||{};activeLessonIdx=d.activeLessonIdx||0;
  CURRICULUM.forEach(l=>{l.done=currProgress[l.id]?.done||false;});
  initTileSeeds();updateStats();renderCurriculum();updateMission();
  addLog('📂 Cargado.','lok');
}
function resetGame(seed){
  if(!seed&&!confirm('¿Nueva partida? Se perderá el progreso.')) return;
  const ns=seed||(Date.now()^Math.floor(Math.random()*0xFFFF));
  const{map:m,rooms}=generateMap(ns);
  const{objects:o,heroStart}=placeObjects(m,rooms,ns);
  map=m;objects=o;
  hero={x:heroStart[1],y:heroStart[0],hp:100,maxHp:100,atk:10,lvl:1,xp:0,xpNext:50,gold:0,def:0,steps:0,kills:0,chests:0};
  inventory=[];logs=[];currentEnemy=null;visitedCells=new Set();
  revealAround(hero.x,hero.y);initTileSeeds();
  document.getElementById('seed-disp').textContent=ns.toString(16).toUpperCase().slice(-6);
  document.getElementById('log').innerHTML='';
  initCurriculum();renderCurriculum();updateMission();updateStats();
  addLog('🗺 Nuevo mapa. ¡Usa SELECT * FROM mapa; para explorar!','linfo');
}

// ════════════════════════════════════════════════════
// INPUT EVENTS
// ════════════════════════════════════════════════════
const cmdEl=document.getElementById('cmd');
cmdEl.addEventListener('input',e=>buildAC(e.target.value));
cmdEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ ejecutar(); return; }
  if(e.key==='Tab'){ e.preventDefault(); if(acFiltered.length&&acSelIdx>=0)selectAC(acSelIdx); else if(acFiltered.length)selectAC(0); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); acMoveSelect(1); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); acMoveSelect(-1); return; }
  if(e.key==='Escape'){ document.getElementById('ac-list').classList.remove('open'); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('#ac-wrap')) document.getElementById('ac-list').classList.remove('open'); });

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
resetGame(Date.now()^0xBEEF);
render();
drawLegend();
</script>
